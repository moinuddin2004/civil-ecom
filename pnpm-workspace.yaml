packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@scarf/scarf': true
  mongodb-memory-server: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - nestjs-pino@5.3.0
# Security fixes for transitive dependencies (`pnpm audit`, SPEC §16), each within its own major
# version so nothing breaks. Remove an entry once the parent package ships the fix itself.
overrides:
  nanoid@3: ^3.3.18            # next > postcss (build time)
  flatted@3: ^3.4.2            # eslint > file-entry-cache (dev)
  picomatch@2: ^2.3.2          # @next/eslint-plugin-next > fast-glob (dev)
  brace-expansion@5: ^5.0.12   # @nestjs/cli, typescript-eslint > minimatch (dev)
  '@humanfs/node@0': ^0.16.8   # eslint (dev)
