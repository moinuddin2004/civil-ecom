# /etc/mongod.conf for the VPS (SPEC §18.1): single-node replica set (transactions need one), only
# reachable from the server itself, access control on, WiredTiger cache capped at 1 GB of the 4 GB.
# Setup steps (keyfile, replica set, users) are in infra/DEPLOY.md.

storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen

net:
  port: 27017
  bindIp: 127.0.0.1

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

replication:
  replSetName: rs0

security:
  authorization: enabled
  # A replica set with access control needs a keyfile, even with one member.
  keyFile: /etc/mongod-keyfile
