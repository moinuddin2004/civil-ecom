# Nginx for shop.aricon.com.pk (SPEC §18.2) behind Cloudflare (SSL mode "Full (strict)").
# Install: copy to /etc/nginx/sites-available/, link into sites-enabled, `nginx -t && systemctl reload nginx`.

# Visitor IPs from Cloudflare (rate limits and logs must see the visitor, not Cloudflare).
# Ranges from https://www.cloudflare.com/ips/ — re-check them now and then.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream aricon_api {
  server 127.0.0.1:4000;
  keepalive 16;
}

upstream aricon_web {
  server 127.0.0.1:3000;
  keepalive 16;
}

# Plain http only answers Cloudflare's redirect to https.
server {
  listen 80;
  listen [::]:80;
  server_name shop.aricon.com.pk;
  return 301 https://$host$request_uri;
}

server {
  # `listen … http2` because Ubuntu 24.04 ships Nginx 1.24 (the `http2 on;` directive is 1.25.1+).
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name shop.aricon.com.pk;

  # Cloudflare Origin Certificate (see infra/DEPLOY.md).
  ssl_certificate     /etc/ssl/cloudflare/shop.aricon.com.pk.pem;
  ssl_certificate_key /etc/ssl/cloudflare/shop.aricon.com.pk.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Uploads: images 8 MB, receipts and imports 5 MB (plus multipart overhead).
  client_max_body_size 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;

  # The API (NestJS).
  location /api/ {
    proxy_pass http://aricon_api;
  }

  # Next.js's revalidation endpoint is for the API on this server only (127.0.0.1:3000), never the internet.
  location /_internal/ {
    return 404;
  }

  # Built assets have content hashes in their names: cache for a year.
  location /_next/static/ {
    proxy_pass http://aricon_web;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else is the web app (storefront, account, admin).
  location / {
    proxy_pass http://aricon_web;
  }
}
