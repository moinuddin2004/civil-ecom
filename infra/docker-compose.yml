# Local development database: MongoDB as a single-node replica set (transactions need one).
#   docker compose -f infra/docker-compose.yml up -d
# Connection string (apps/api/.env): mongodb://127.0.0.1:27017/aricon?replicaSet=rs0
name: aricon

services:
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      # Only reachable from this machine.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
      - ./mongo/init-replica-set.js:/scripts/init-replica-set.js:ro
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once this node is PRIMARY.
      test: ['CMD', 'mongosh', '--quiet', '--file', '/scripts/init-replica-set.js']
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30
    restart: unless-stopped

volumes:
  mongo-data:
