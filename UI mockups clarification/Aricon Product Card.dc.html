<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#FFFFFF;border:1px solid #DDE1E4;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;height:100%;box-sizing:border-box;font-family:'Noto Sans',sans-serif;color:#1E2A32">
  <div onClick="{{ p.open }}" style="cursor:pointer;aspect-ratio:1/1;padding:12px;position:relative;box-sizing:border-box">
    <div style="width:100%;height:100%;border-radius:6px;background:#F6F7F8;display:flex;align-items:center;justify-content:center;color:#A9B1B7;opacity:{{ p.imgOpacity }}">{{ p.img }}</div>
    <sc-if value="{{ p.oos }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:18px;left:18px;background:#FDECEA;color:#B42318;font-size:12px;line-height:16px;font-weight:500;padding:3px 6px;border-radius:4px">Out of stock</span></sc-if>
    <sc-if value="{{ p.low }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:18px;left:18px;background:#FFF3CC;color:#1E2A32;font-size:12px;line-height:16px;font-weight:500;padding:3px 6px;border-radius:4px">{{ p.lowLabel }}</span></sc-if>
  </div>
  <div style="padding:0 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1">
    <div style="font-size:14px;line-height:20px;color:#6B747B">{{ p.brand }}</div>
    <div onClick="{{ p.open }}" style="cursor:pointer;font-size:16px;line-height:22px;min-height:44px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ p.name }}</div>
    <div style="display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;margin-top:2px">
      <span style="font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:20px;line-height:24px;font-variant-numeric:tabular-nums">{{ p.priceLabel }}</span>
      <span style="font-size:14px;line-height:20px;color:#6B747B">/ {{ p.unit }}</span>
    </div>
    <sc-if value="{{ p.hasSave }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <s style="font-size:14px;line-height:20px;color:#6B747B;font-variant-numeric:tabular-nums">{{ p.mrpLabel }}</s>
        <span style="background:#E7F4EC;color:#1E7B4F;font-size:12px;line-height:16px;font-weight:500;padding:2px 6px;border-radius:4px">{{ p.saveLabel }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ p.hasBulk }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;gap:6px;align-items:center;color:#1F5AA6;font-size:14px;line-height:20px">{{ p.bulkIcon }}<span>{{ p.bulkLabel }}</span></div>
    </sc-if>
    <div style="flex:1;min-height:8px"></div>
    <sc-if value="{{ p.btnMain }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ p.add }}" style="height:44px;border:0;border-radius:6px;background:#F2A900;color:#1E2A32;font:600 16px/20px 'Noto Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%" style-hover="background:#D99600" style-active="background:#B97F00">{{ p.cartIcon }}<span>{{ p.btnLabel }}</span></button>
    </sc-if>
    <sc-if value="{{ p.btnChoose }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ p.open }}" style="height:44px;border:1px solid #1E2A32;border-radius:6px;background:#FFFFFF;color:#1E2A32;font:600 16px/20px 'Noto Sans',sans-serif;cursor:pointer;width:100%" style-hover="background:#F6F7F8">Choose options</button>
    </sc-if>
    <sc-if value="{{ p.oos }}" hint-placeholder-val="{{ false }}">
      <button disabled="{{ true }}" style="height:44px;border:0;border-radius:6px;background:#EEF0F1;color:#A9B1B7;font:600 16px/20px 'Noto Sans',sans-serif;width:100%;cursor:not-allowed">Out of stock</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:440},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
